name: Build APK + Web

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Mantém a mesma chave de assinatura entre builds (para atualizar o APK sem desinstalar)
      - name: Restaurar chave de assinatura
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: financa-debug-keystore-v1

      - name: Gerar arquivos de plataforma
        run: |
          flutter --version | tee ../ci-flutter-version.txt
          flutter create --org com.arthurvalf --project-name financa --platforms android,web . 2>&1 | tee ../ci-create.log

      - name: Dependências
        run: flutter pub get 2>&1 | tee ../ci-pub.log

      - name: Análise
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ../ci-analyze.log

      - name: Testes
        continue-on-error: true
        run: flutter test 2>&1 | tee ../ci-test.log

      # A chave do Gemini vem do segredo GEMINI_API_KEY (Settings > Secrets and variables > Actions).
      # Ela é embaralhada antes de entrar no APK e nunca aparece nos logs nem na versão web.
      - name: Preparar chave do Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            X=$(python3 -c "import os,base64;k=os.environ['GEMINI_API_KEY'].strip().encode();m=b'jose-pinto-financa';print(base64.b64encode(bytes(c^m[i%len(m)] for i,c in enumerate(k))).decode())")
            echo "::add-mask::$X"
            echo "GEMINI_DEFINE=--dart-define=GEMINI_KEY_X=$X" >> "$GITHUB_ENV"
            echo "Chave do Gemini: configurada" | tee ../ci-key.txt
          else
            echo "GEMINI_DEFINE=" >> "$GITHUB_ENV"
            echo "Chave do Gemini: AUSENTE (crie o segredo GEMINI_API_KEY)" | tee ../ci-key.txt
          fi

      - name: Build APK
        run: |
          flutter build apk --release --obfuscate --split-debug-info=build/symbols $GEMINI_DEFINE 2>&1 | tee ../ci-apk.log
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/financa-beta.apk

      - name: Build Web
        run: flutter build web --release --base-href /App_Financeiro/ 2>&1 | tee ../ci-web.log

      - name: Publicar APK (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          name: Finança beta ${{ github.run_number }}
          body: |
            APK de teste do Finança (beta). Baixe o arquivo `financa-beta.apk` abaixo no celular Android e instale.
            Commit: ${{ github.sha }}
          prerelease: true
          files: mobile/build/app/outputs/flutter-apk/financa-beta.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar versão web (branch gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: mobile/build/web
          force_orphan: true

      - name: Salvar logs do build (branch ci-logs)
        if: always()
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/ci && cp ci-*.log ci-*.txt /tmp/ci/ 2>/dev/null || true
          echo "status=${{ job.status }} run=${{ github.run_number }} sha=${{ github.sha }}" > /tmp/ci/STATUS.txt
          cd /tmp/ci
          git init -q
          git checkout -q -b ci-logs
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "logs run ${{ github.run_number }}"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-logs
